<h1>OCR Result</h1>

<h3>Applied Filter:</h3>

<p>{{ filter }}</p>

<h3>Detected Text:</h3>

<p>{{ obj.extracted_text }}</p>

<h3>Metrics</h3>

<p>
Processing time:
{{ obj.processing_time }} seconds
</p>

<p>
Characters detected:
{{ obj.text_count }}
</p>

<img src="{{ obj.image.url }}" width="400">
